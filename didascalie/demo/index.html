<!doctype html>
<html lang="fr" data-peau="jour">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Didascalie — les réponses inline</title>
<meta name="description" content="Le cœur de Didascalie : répondre à un passage précis d’un message, qu’il soit écrit, parlé ou filmé.">
<meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101018" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../ui/styles.css">
</head>
<body>

<div class="app">
  <header class="entete">
    <span class="av" aria-hidden="true"></span>
    <div class="qui">
      <div class="nom">Testeur</div>
      <div class="sous">En ligne</div>
    </div>
    <button class="outil" id="bouton-message" aria-label="Testeur envoie un message découpé — un texte, un vocal, une vidéo, à tour de rôle" title="Testeur envoie un message (texte, vocal, vidéo, à tour de rôle)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/>
      </svg>
    </button>
    <button class="outil" id="bouton-frappe" aria-label="Simuler : Testeur répond à un passage" title="Testeur se met à répondre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 19l5-14 5 14M4.7 14.5h6.6M15 19l3-9 3 9M15.9 16.2h4.2"/>
      </svg>
    </button>
    <button class="outil" id="bouton-peau" aria-label="Basculer jour / nuit" title="Jour / nuit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>
      </svg>
    </button>
    <button class="outil" id="bouton-reglages" aria-label="Réglages des réponses" title="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h11M19 7h1M4 12h3M11 12h9M4 17h7M15 17h5"/>
        <circle cx="17" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="13" cy="17" r="2.2"/>
      </svg>
    </button>
  </header>

  <main class="fil" id="fil" aria-label="Conversation avec Testeur"></main>

  <div class="barre" id="barre"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
